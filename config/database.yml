default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: hamara_group_development
  username: postgres
  password: root
  host: localhost

test:
  <<: *default
  database: hamara_group_test
  username: <%= ENV["DB_USERNAME"] %>
  password: <%= ENV["DB_PASSWORD"] %>
  host: localhost

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>